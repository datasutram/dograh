name: Build and Push to ECR

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "ui/**"
      - "pipecat/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/ecr-build-push.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: false
        default: main
        type: string
      services:
        description: "Which services to build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - api
          - ui

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecr-build-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REPO: 203697057509.dkr.ecr.ap-south-1.amazonaws.com/dograh

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'pipecat/**'
              - 'scripts/**'
              - 'docs/**'
            ui:
              - 'ui/**'

  build-api:
    needs: [changes]
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' && (inputs.services == 'both' || inputs.services == 'api')) ||
      (github.event_name == 'push' && needs.changes.outputs.api == 'true')
    runs-on: ubuntu-24.04
    environment: dograh
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: true

      - name: Compute tags
        id: meta
        run: |
          SHA="$(git rev-parse --short=8 HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.UAT_AWS_BUILD_ROLE_ARN }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push dograh-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REPO }}:api-${{ steps.meta.outputs.sha }}
            ${{ env.ECR_REPO }}:api-latest
          cache-from: type=gha,scope=ecr-dograh-api
          cache-to: type=gha,mode=max,scope=ecr-dograh-api

      - name: Summary
        run: |
          echo "### dograh-api" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.ECR_REPO }}:api-${{ steps.meta.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  build-ui:
    needs: [changes]
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' && (inputs.services == 'both' || inputs.services == 'ui')) ||
      (github.event_name == 'push' && needs.changes.outputs.ui == 'true')
    runs-on: ubuntu-24.04
    environment: dograh
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Compute tags
        id: meta
        run: |
          SHA="$(git rev-parse --short=8 HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.UAT_AWS_BUILD_ROLE_ARN }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push dograh-ui
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REPO }}:ui-${{ steps.meta.outputs.sha }}
            ${{ env.ECR_REPO }}:ui-latest
          cache-from: type=gha,scope=ecr-dograh-ui
          cache-to: type=gha,mode=max,scope=ecr-dograh-ui

      - name: Summary
        run: |
          echo "### dograh-ui" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.ECR_REPO }}:ui-${{ steps.meta.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
